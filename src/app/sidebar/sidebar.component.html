<div class="sidebar">
  <div class="sidebar-header">
    <h3>Chat History</h3>
    <div class="header-buttons">
      <a routerLink="/policies" class="policies-sidebar-btn" aria-label="View policies" *ngIf="!isPoliciesPage()">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
        </svg>
        Policies
      </a>
    </div>
    <div class="header-buttons" *ngIf="!showGoToChat()">
      <button (click)="onNewChat()" class="new-chat-btn" aria-label="Create new chat" [disabled]="!canNewChat()">New Chat</button>

      <button
        (click)="onDeleteAllChats()"
        class="delete-all-btn"
        *ngIf="chats().length > 1"
        aria-label="Delete all chats"
      >
        Delete All
      </button>
    </div>
    <div class="header-buttons" *ngIf="showCreatePolicy()">
      <button (click)="onCreatePolicy()" class="new-policy-btn" aria-label="Create new policy">
        <span>+</span> Create Policy
      </button>
    </div>
    <div class="header-buttons" *ngIf="showGoToChat()">
      <a routerLink="/chat" class="back-to-chat-btn">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        Back to Chat
      </a>
    </div>
  </div>
  <div class="chat-list">
    @for (chat of chats(); track chat.id) {
      <div
        class="chat-item"
        [class.active]="chat.id === currentChatId() && !!chat.title.trim()"
        [class.untitled]="!chat.title.trim()"
        (click)="onSelectChat(chat.id)"
      >
        <span class="chat-title" [style.font-style]="hasDraft(chat) ? 'italic' : 'normal'" [style.color]="hasDraft(chat) ? 'var(--primary-color)' : ''">
          {{ chat.title || 'New Chat' }}
          @if (hasDraft(chat)) {
            <span style="font-size: 0.85em; opacity: 0.8; margin-left: 4px;">[Draft]</span>
          }
        </span>
        @if (chat.title.trim()) {
          <button
            class="delete-btn"
            (click)="onDeleteChat(chat.id, $event)"
            aria-label="Delete chat"
            title="Delete chat"
          >
            <svg class="trash-icon" viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
              <path d="M3 6h18v2H3V6zm2 2h14v13c0 1.1-.9 2-2 2H7c-1.1 0-2-.9-2-2V8zm3 0h8v13H8V8zm2 2h4v9H10v-9z"/>
              <path d="M9 4V2c0-.55.45-1 1-1h4c.55 0 1 .45 1 1v2H9z"/>
            </svg>
          </button>
        }
      </div>
    }
  </div>
</div>
