@if (authPrompt.visible()) {
  <div class="auth-prompt-overlay" (click)="authPrompt.close()">
    <div class="auth-prompt-card" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="authPrompt.close()" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M18 6L6 18"></path>
          <path d="M6 6l12 12"></path>
        </svg>
      </button>

      <div class="auth-prompt-hero">
        <span class="auth-kicker">Protected Access</span>
        <h3>Log in or create an account to open policy records.</h3>
        <p>
          Policy details and edit tools are available only for signed-in users. Continue with your
          account or create one now from this popup.
        </p>
      </div>

      <div class="auth-prompt-actions">
        <button class="primary-btn" (click)="navigateToLogin()">Log in</button>
        <button class="secondary-btn" (click)="navigateToSignup()">Create account</button>
      </div>

    </div>
  </div>
}
