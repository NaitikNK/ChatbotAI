<div class="chat-container">
  <div class="chat-header">
    <div class="header-left">
      <button class="menu-btn" (click)="onToggleSidebar()" aria-label="Toggle sidebar">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <h2>Chat</h2>
    </div>
    <div class="header-actions">
    </div>
  </div>
  <div class="messages" #messagesContainer>
    @for (message of messages(); track $index) {
      <div class="message" [class.user]="message.role === 'user'" [class.assistant]="message.role === 'assistant'">
        <div class="message-content">
          @if (message.role === 'assistant') {
            <markdown [data]="message.text"></markdown>
          } @else {
            {{ message.text }}
          }
        </div>

        <div class="message-footer">
          <span class="timestamp">{{ message.createdAt | date:'shortTime' }}</span>
          @if (message.role === 'assistant') {
            <button class="icon-btn" (click)="copyMessage(message.text)" title="Copy message" aria-label="Copy">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          }
        </div>

      </div>
    }

    @if (busy()) {
      <div class="message assistant typing-indicator">
        <span></span>
        <span></span>
        <span></span>
      </div>
    }

  </div>
  <div class="input-area-wrapper">
    <div class="input-container">
      <div class="add-btn-container">
        <button class="add-btn" (click)="onPlusClick()" aria-label="Add attachment" [disabled]="busy()" title="Coming soon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        @if (showPlusTooltip()) {
          <div class="plus-tooltip">Coming soon</div>
        }
      </div>
      <textarea
        [ngModel]="newMessage"
        (ngModelChange)="onInputChange($event)"
        (input)="autoGrow($event)"
        (keydown.enter)="onEnterDown($event)"
        placeholder="How can I help you today?"
        [disabled]="busy()"
        rows="1"
        class="auto-expand"
      ></textarea>
      
      <div class="input-actions">
        <button (click)="onSendMessage()" class="send-btn" [disabled]="busy() || !newMessage.trim()" aria-label="Send message" title="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
